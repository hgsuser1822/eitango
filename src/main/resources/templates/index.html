<!- <!DOCTYPE html>
  <html lang="ja" xmlns:th="http://www.thymeleaf.org">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>英単語アプリ</title>
    <link rel="stylesheet" href="/style.css">
  </head>

  <body>


    <div class="content">


      <!-- ホーム画面 -->

      <div th:if="${page == 'home'}">

        <h1 class="home-title">
          英単語アプリ
        </h1>

      </div>



      <!-- 単語画面 -->

      <!-- 単語トップ -->

      <div th:if="${page == 'words'}">

        <div class="app">

          <h1>単語</h1>

          <h2>TOEICスコアを選択</h2>

          <div class="choices">

            <a th:each="score : ${scores}" th:href="@{/words/score/{score}(score=${score})}" class="score-button"
              th:text="'TOEIC ' + ${score}">
            </a>

          </div>

        </div>

      </div>
      <!-- ステージ一覧 -->

      <div th:if="${page == 'stages'}">

        <div class="app">

          <h1 th:text="'TOEIC ' + ${score}"></h1>

          <h2>ステージを選択</h2>

          <div class="choices">

            <a th:each="stage : ${stages}" th:href="@{/quiz(score=${score},stage=${stage})}" class="score-button"
              th:text="'ステージ ' + ${stage}">
            </a>

          </div>

        </div>

      </div>


      <div th:if="${page == 'quiz'}">

        <div class="app">

          <h1>英単語問題</h1>

          <div class="word" th:text="${word}">
          </div>


          <div class="choices">

            <button th:each="choice : ${choices}" type="button" th:text="${choice}" th:attr="data-choice=${choice}"
              onclick="checkAnswer(this.dataset.choice)">
            </button>

          </div>


          <div id="result"></div>

        </div>

      </div>



      <div th:if="${page == 'study'}">

        <h1>🎧 リスニング</h1>

        <select id="situation-select">
          <option value="hotel">ホテル</option>
          <option value="company">会社</option>
          <option value="hospital">病院</option>
          <option value="restaurant">レストラン</option>
          <option value="station">駅</option>
          <option value="theater">映画館</option>
          <option value="airport">空港</option>
          <option value="amusement_park">遊園地</option>
          <option value="zoo">動物園</option>
          <option value="library">図書館</option>
          <option value="party">パーティー</option>
          <option value="park">公園</option>
          <option value="wedding">結婚式</option>
          <option value="summer_festival">夏祭り</option>
          <option value="youth">青春</option>
          <option value="romantic">恋愛</option>
          <option value="job">仕事</option>

        </select>

        <select id="level-select">
          <option value="tyuugaku_level">中学英語レベル</option>
          <option value="koukou_level">高校英語レベル</option>
          <option value="TOEIC700_level">TOEIC700レベル</option>
          <option value="TOEIC800_level">TOEIC800レベル</option>
          <option value="TOEIC900_level">TOEIC900レベル</option>
          <option value="native_level">ネイティブレベル</option>
        </select>

        <select id="length-select">
          <option value="20">20秒</option>
          <option value="30">30秒</option>
          <option value="40">40秒</option>
          <option value="50">50秒</option>
        </select>

        <select id="freedom-select">
          <option value="almost_fixed">ほぼ定型文</option>
          <option value="normal">普通</option>
          <option value="slightly_strange">個性強め</option>
          <option value="crazy">唯一無二</option>
        </select>


        <button type="button" onclick="generateListening()">
          リスニングを生成
        </button>

        <div id="loading" style="display: none;">
          生成中...
        </div>

        <div id="script"
          style="display: none; margin-top: 20px; white-space: pre-line; line-height: 1.8; text-align: left;">
        </div>

        <button id="script-button" type="button" onclick="toggleScript()" style="display: none; margin-top: 15px;">
          スクリプトを見る
        </button>


        <div id="audio-area" style="display: none; margin-top: 20px;">

          <audio id="audio" controls>

          </audio>

        </div>

      </div>


      <!-- 履歴画面 -->

      <div th:if="${page == 'history'}">

        <h1>履歴</h1>

        <p>ここに学習履歴を表示します。</p>

      </div>



      <!-- 設定画面 -->

      <div th:if="${page == 'settings'}">

        <h1>設定</h1>

        <p>ここに設定を作ります。</p>

      </div>

    </div>

    <!-- 下の5つのボタン -->

    <nav class="bottom-nav">


      <a href="/" th:classappend="${page == 'home'} ? 'active' : ''">

        <span>🏠</span>

        ホーム

      </a>


      <a href="/words" th:classappend="${page == 'words' or page == 'quiz'} ? 'active' : ''">

        <span>📖</span>

        単語

      </a>

      <a href="/study" th:classappend="${page == 'study'} ? 'active' : ''">

        <span>🎧</span>

        リスニング

      </a>


      <a href="/history" th:classappend="${page == 'history'} ? 'active' : ''">

        <span>📊</span>

        履歴

      </a>


      <a href="/settings" th:classappend="${page == 'settings'} ? 'active' : ''">

        <span>⚙️</span>

        設定

      </a>


    </nav>



    <script>

      function checkAnswer(choice) {
        fetch("/answer?choice=" + encodeURIComponent(choice), {
          method: "POST"
        })

          .then(response => response.text())
          .then(result => {

            const resultElement =
              document.getElementById("result");

            if (result === "correct" ||
              result === "correct_finished") {

              resultElement.textContent = "〇";
              resultElement.style.color = "#22c55e";

            } else {

              resultElement.textContent = "×";
              resultElement.style.color = "#ef4444";
            }
            // =========================
            // 10問終了
            // =========================

            if (result === "correct_finished" ||
              result === "incorrect_finished") {

              setTimeout(() => {

                alert("10問終了！");

              }, 500);

              return;
            }


            // =========================
            // 次の問題へ
            // =========================

            setTimeout(() => {

              location.reload();

            }, 700);

          });
      }



      // =========================
      // リスニング生成
      // =========================

      function generateListening() {

        const loading =
          document.getElementById("loading");

        const script =
          document.getElementById("script");

        const audioArea =
          document.getElementById("audio-area");

        const audio =
          document.getElementById("audio");

        const scriptButton =
          document.getElementById("script-button");


        // =========================
        // 選択された条件を取得
        // =========================

        const situation =
          document.getElementById("situation-select").value;

        const level =
          document.getElementById("level-select").value;

        const length =
          document.getElementById("length-select").value;

        const freedom =
          document.getElementById("freedom-select").value;


        console.log("送信する条件:");
        console.log("situation:", situation);
        console.log("level:", level);
        console.log("length:", length);
        console.log("freedom:", freedom);


        // =========================
        // 生成中
        // =========================

        loading.style.display = "block";

        script.style.display = "none";
        script.textContent = "";

        scriptButton.style.display = "none";

        audioArea.style.display = "none";


        // =========================
        // Javaへリクエスト
        // =========================

        fetch(
          `/generate-listening?situation=${encodeURIComponent(situation)}&level=${encodeURIComponent(level)}&length=${encodeURIComponent(length)}&freedom=${encodeURIComponent(freedom)}`
        )

          .then(response => {

            if (!response.ok) {

              throw new Error(
                "Javaからエラーが返されました"
              );

            }

            return response.json();

          })

          .then(data => {

            console.log("Javaから受信:", data);


            // =========================
            // スクリプト
            // =========================

            script.textContent = data.script;

            script.style.display = "none";

            scriptButton.style.display = "block";

            scriptButton.textContent =
              "スクリプトを見る";


            // =========================
            // 音声
            // =========================

            console.log(
              "音声URL:",
              data.audio
            );


            // =========================
            // 音声読み込み成功
            // =========================

            audio.oncanplay = function () {

              console.log(
                "音声の読み込み成功"
              );

              audioArea.style.display = "block";

              loading.style.display = "none";


              // 自動再生
              audio.play().catch(error => {

                console.log(
                  "自動再生はブロックされました:",
                  error
                );

              });

            };


            // =========================
            // 音声読み込み失敗
            // =========================

            audio.onerror = function () {

              console.error(
                "音声ファイルの読み込みに失敗しました"
              );

              console.error(
                "audio.error:",
                audio.error
              );

              console.error(
                "読み込もうとしたURL:",
                audio.src
              );

              loading.style.display = "none";

              alert(
                "音声ファイルの読み込みに失敗しました。"
              );

            };


            // =========================
            // 音声URLを設定
            // =========================

            audio.src = data.audio;

            audio.load();

          })

          .catch(error => {

            console.error(
              "リスニング生成エラー:",
              error
            );

            loading.style.display = "none";

            alert(
              "リスニング生成に失敗しました。"
            );

          });

      }


      // =========================
      // スクリプト表示・非表示
      // =========================

      function toggleScript() {

        const script =
          document.getElementById("script");

        const button =
          document.getElementById("script-button");


        if (script.style.display === "none") {

          script.style.display = "block";

          button.textContent =
            "スクリプトを隠す";

        } else {

          script.style.display = "none";

          button.textContent =
            "スクリプトを見る";

        }

      }

    </script>




  </body>

  </html>

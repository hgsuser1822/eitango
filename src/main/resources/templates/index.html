<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英単語アプリ</title>

    <link rel="stylesheet" href="/style.css">

    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f5f7fa;
            padding-top: 80px;
        }

        .app {
            background: white;
            width: 400px;
            max-width: 90%;
            margin: auto;
            padding: 40px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
        }

        .word {
            font-size: 48px;
            font-weight: bold;
            margin: 40px 0 20px;
            color: #2563eb;
        }

        .meaning {
            font-size: 28px;
            margin-bottom: 30px;
            color: #333;
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            font-size: 18px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #result {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>英単語アプリ</h1>

    <h1 th:text="${word}"></h1>

    <div class="choices">
        <button th:each="choice : ${choices}"
                type="button"
                th:text="${choice}"
                th:attr="data-choice=${choice}"
                onclick="checkAnswer(this.dataset.choice)">
        </button>
    </div>


    <div id="result"></div>

</div>

<script>
    function checkAnswer(choice) {

        fetch("/answer?choice=" + encodeURIComponent(choice), {
            method: "POST"
        })
        .then(response => response.text())
        .then(result => {

            const resultElement = document.getElementById("result");

            if (result === "correct") {
                resultElement.textContent = "〇";
                resultElement.style.color = "#22c55e";
            } else {
                resultElement.textContent = "×";
                resultElement.style.color = "#ef4444";
            }

            resultElement.style.fontSize = "100px";
            resultElement.style.fontWeight = "bold";
        });
    }
</script>

</body>
</html>
